<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Axltte Nightfox</title>
<meta name="description" content="Art by Axltte Nightfox. Site coming soon. Commissions coming soon.">

<!-- Opt out of AI / machine-learning use. Not every crawler honors these, so robots.txt does the same job. -->
<meta name="robots" content="index, follow, noai, noimageai">
<meta name="tdm-reservation" content="1">
<meta name="copyright" content="© Axltte Nightfox. All rights reserved. Not licensed for AI/ML training.">

<meta property="og:title" content="Axltte Nightfox">
<meta property="og:description" content="Art by Axltte Nightfox. Coming soon.">
<meta property="og:url" content="https://foxgirl.art/">
<meta name="theme-color" content="#1e1410">

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght,SOFT@0,9..144,300..700,100;1,9..144,300..700,100&family=DM+Mono:wght@400;500&display=swap" rel="stylesheet">

<style>
  /* ---------- Palette: swap colors here ---------- */
  :root {
    --espresso:   #1e1410;  /* page background */
    --dark-roast: #2b1d16;  /* panels, rings */
    --mocha:      #6f4e37;  /* rules, quiet accents */
    --latte:      #c8a27c;  /* secondary text, links */
    --crema:      #e8d5b9;  /* primary text */
    --cream:      #f5ece0;  /* wordmark highlight */

    --bg:     var(--espresso);
    --text:   var(--crema);
    --muted:  var(--latte);
    --rule:   var(--mocha);
    --accent: var(--cream);
  }

  *, *::before, *::after { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; }

  body {
    background:
      radial-gradient(ellipse 70% 55% at 50% 42%, var(--dark-roast) 0%, transparent 70%),
      var(--bg);
    color: var(--text);
    font-family: "DM Mono", ui-monospace, monospace;
    font-size: 15px;
    line-height: 1.6;
    display: flex;
    flex-direction: column;
    min-height: 100vh;
    padding: 0 16px;
    -webkit-font-smoothing: antialiased;
  }

  main {
    flex: 1;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    text-align: center;
    padding: 64px 0 40px;
  }

  /* Steam: purely decorative */
  .steam { width: 72px; height: 64px; margin-bottom: 20px; overflow: visible; }
  .steam path {
    fill: none;
    stroke: var(--latte);
    stroke-width: 2;
    stroke-linecap: round;
    opacity: 0;
    animation: rise 4.5s ease-in-out infinite;
  }
  .steam path:nth-child(2) { animation-delay: 1.5s; }
  .steam path:nth-child(3) { animation-delay: 3s; }
  @keyframes rise {
    0%   { opacity: 0;   transform: translateY(10px); }
    35%  { opacity: .55; }
    100% { opacity: 0;   transform: translateY(-14px); }
  }

  .eyebrow {
    font-size: 12px;
    letter-spacing: .32em;
    text-transform: uppercase;
    color: var(--muted);
    margin: 0 0 14px;
  }

  h1 {
    font-family: "Fraunces", Georgia, serif;
    font-variation-settings: "SOFT" 100, "opsz" 144;
    font-weight: 400;
    font-size: clamp(2.6rem, 11vw, 6.5rem);
    line-height: .95;
    letter-spacing: -.01em;
    margin: 0;
    color: var(--text);
  }
  h1 .night {
    display: block;
    font-style: italic;
    font-weight: 300;
    color: var(--accent);
  }

  .rule {
    width: 56px;
    height: 1px;
    background: var(--rule);
    border: 0;
    margin: 36px auto;
  }

  .status { margin: 0; font-size: 14px; letter-spacing: .08em; }
  .status strong { font-weight: 500; color: var(--accent); }

  .contact { margin: 22px 0 0; font-size: 14px; color: var(--muted); }
  .contact a {
    color: var(--text);
    text-decoration: none;
    border-bottom: 1px solid var(--rule);
    padding-bottom: 2px;
    transition: border-color .2s, color .2s;
  }
  .contact a:hover { color: var(--accent); border-color: var(--latte); }
  a:focus-visible {
    outline: 2px solid var(--latte);
    outline-offset: 4px;
    border-radius: 2px;
  }

  footer {
    text-align: center;
    font-size: 11.5px;
    line-height: 1.7;
    color: var(--muted);
    padding: 24px 0 28px;
    border-top: 1px solid var(--dark-roast);
    max-width: 560px;
    margin: 0 auto;
    width: 100%;
  }
  footer p { margin: 0 0 6px; }
  footer a { color: var(--muted); }

  .visually-hidden {
    position: absolute; width: 1px; height: 1px; padding: 0; margin: -1px;
    overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; border: 0;
  }

  /* ---------- Art protection: applies to anything marked data-art ---------- */
  [data-art] {
    position: relative;
    -webkit-user-select: none;
    user-select: none;
    -webkit-touch-callout: none;   /* no long-press "Save image" on iOS */
  }
  [data-art] img { pointer-events: none; -webkit-user-drag: none; }
  [data-art]::after {               /* see-through shield over the image */
    content: "";
    position: absolute;
    inset: 0;
  }

  @media (prefers-reduced-motion: reduce) {
    .steam path { animation: none; opacity: .4; }
  }
</style>
</head>
<body>

<main>
  <svg class="steam" viewBox="0 0 72 64" aria-hidden="true" focusable="false">
    <path d="M22 58 C 14 46, 30 38, 22 26 S 26 10, 22 4"/>
    <path d="M36 58 C 28 46, 44 38, 36 26 S 40 10, 36 4"/>
    <path d="M50 58 C 42 46, 58 38, 50 26 S 54 10, 50 4"/>
  </svg>

  <p class="eyebrow">Art &middot; Coming soon</p>
  <h1>Axltte<span class="night">Nightfox</span></h1>

  <hr class="rule" aria-hidden="true">

  <p class="status"><strong>Commissions coming soon.</strong></p>

  <p class="contact">
    <span id="contact">
      <noscript>Email: hello [at] foxgirl [dot] art</noscript>
    </span>
  </p>
</main>

<footer>
  <p>&copy; <span id="year">2026</span> Axltte Nightfox. All rights reserved.</p>
  <p>No artwork or content on this site may be used to train, fine-tune, or prompt AI or machine-learning models.</p>
  <p>Site by <a href="https://rwdco.us">RWD Co.</a></p>
</footer>

<script>
  /* ---------- Contact email ----------
     Built in the browser so simple scrapers can't harvest it from the page source.
     To switch addresses, change USER only. */
  (function () {
    var USER = "hello";
    var DOMAIN = "foxgirl" + "." + "art";
    var addr = USER + "@" + DOMAIN;
    var a = document.createElement("a");
    a.href = "mailto:" + addr;
    a.textContent = addr;
    var slot = document.getElementById("contact");
    slot.textContent = "";
    slot.append("Say hello: ", a);
  })();

  document.getElementById("year").textContent = new Date().getFullYear();

  /* ---------- Art protection ----------
     Only affects elements marked data-art, so links, text and
     assistive-tech menus keep working everywhere else. */
  (function () {
    function onArt(e) {
      return e.target instanceof Element && e.target.closest("[data-art]");
    }
    document.addEventListener("contextmenu", function (e) { if (onArt(e)) e.preventDefault(); });
    document.addEventListener("dragstart",   function (e) { if (onArt(e)) e.preventDefault(); });
  })();
</script>
</body>
</html>
